[package]
name = "farmhabit"
version = "0.1.0"
description = "FarmHabit: tareas, hábitos con granja de animales y notas"
license = "MIT"
edition = "2021"

[lib]
# El sufijo _lib evita choques de nombre con el binario en Windows.
name = "farmhabit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compilado dentro de la app (mismo motor en Windows, Linux y Android).
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
