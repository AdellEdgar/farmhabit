[package]
name = "farmhabit"
version = "1.0.0"
description = "FarmHabit: tareas, hábitos con granja de animales y notas"
license = "MIT"
edition = "2021"

[lib]
# El sufijo _lib evita choques de nombre con el binario en Windows.
name = "farmhabit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compilado dentro de la app (mismo motor en Windows, Linux y Android).
rusqlite = { version = "0.41", features = ["bundled"] }

# Solo escritorio: arranque con el sistema e instancia única (para la bandeja).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Llavero del sistema (Credential Manager en Windows, Secret Service en Linux).
keyring = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
