# Comprueba el código y genera los instaladores de Windows, Linux y Android.
# Los instaladores quedan como "artifacts" de cada ejecución (pestaña Actions).
# Al subir una etiqueta vX.Y.Z se publica además una Release con ellos, y en
# cada push a main se actualiza la demo web en GitHub Pages.
#
# Para que la sincronización con Google Drive funcione en estas compilaciones,
# añade en Settings → Secrets and variables → Actions los secretos
# GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET (ver docs/google-drive.md). Para firmar
# el APK de Android con una clave fija: ANDROID_KEYSTORE y
# ANDROID_KEYSTORE_PASSWORD (ver docs/android.md). Para firmar las
# actualizaciones de escritorio: TAURI_SIGNING_PRIVATE_KEY y
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (ver docs/actualizaciones.md).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  check:
    name: Tests y lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  desktop:
    name: Escritorio (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sin MSI: no admite versiones como 1.0.0-rc.2, y el instalador
          # NSIS (.exe) es el que usa el actualizador.
          - name: Windows
            os: windows-latest
            targets: nsis
            bundles: |
              apps/app/src-tauri/target/release/bundle/nsis/*.exe
              apps/app/src-tauri/target/release/bundle/nsis/*.sig
          - name: Linux
            os: ubuntu-22.04
            targets: deb,appimage
            bundles: |
              apps/app/src-tauri/target/release/bundle/deb/*.deb
              apps/app/src-tauri/target/release/bundle/deb/*.sig
              apps/app/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/app/src-tauri/target/release/bundle/appimage/*.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # La versión de la app sale de la etiqueta (v1.0.0-rc.2 → 1.0.0-rc.2),
      # para que el actualizador sepa cuál es más nueva.
      - name: Versión desde la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/app
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Tests de Rust
        run: pnpm test:rust
        env:
          CI: 'true'
      - name: Compilar instaladores
        run: pnpm build --bundles ${{ matrix.targets }}
      # Firma de las actualizaciones (clave distinta de la de Android): la app
      # instalada rechaza cualquier actualización que no esté firmada con ella.
      - name: Firmar las actualizaciones
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Sin TAURI_SIGNING_PRIVATE_KEY: instaladores sin firma de actualización."
            exit 0
          fi
          shopt -s nullglob
          for f in apps/app/src-tauri/target/release/bundle/{nsis/*.exe,deb/*.deb,appimage/*.AppImage}; do
            pnpm --filter @farmhabit/app tauri signer sign "$PWD/$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: FarmHabit-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Versión desde la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/app
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      # Los runners de Ubuntu ya traen el SDK y el NDK de Android instalados.
      - name: Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Generar el proyecto Android
        working-directory: apps/app
        run: pnpm tauri android init --ci
      # Con el secreto ANDROID_KEYSTORE se compila en modo release y se firma
      # siempre con la misma clave, para que cada versión se instale encima de
      # la anterior sin perder datos. Sin él (forks, PR), firma de depuración.
      - name: Compilar APK
        working-directory: apps/app
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            pnpm tauri android build --apk --target aarch64
          else
            pnpm tauri android build --apk --debug --target aarch64
          fi
      - name: Firmar el APK con la clave de FarmHabit
        working-directory: apps/app/src-tauri/gen/android/app/build/outputs/apk
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "Sin ANDROID_KEYSTORE: se queda la firma de depuración."
            exit 0
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          keystore="$RUNNER_TEMP/farmhabit.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          unsigned=$(find . -name '*-unsigned.apk' | head -n1)
          "$tools/zipalign" -p -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out FarmHabit.apk aligned.apk
          rm -f "$keystore" "$unsigned" aligned.apk ./*.idsig
          "$tools/apksigner" verify FarmHabit.apk
      - uses: actions/upload-artifact@v7
        with:
          name: FarmHabit-Android
          path: apps/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Publicar la Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Renombrar el APK
        run: |
          apk=$(find release -name '*.apk' | head -n1)
          mv "$apk" "release/FarmHabit_${GITHUB_REF_NAME#v}_android.apk"
      # Manifiesto que consultan las apps instaladas para saber si hay versión
      # nueva: instaladores de escritorio con su firma y enlace al APK.
      - name: Manifiesto de actualizaciones (latest.json)
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME"
          platforms='{}'
          add() { # $1 = plataforma del actualizador, $2 = patrón del instalador
            local f
            f=$(find release -name "$2" | head -n1)
            [ -n "$f" ] && [ -f "$f.sig" ] || return 0
            platforms=$(jq --arg k "$1" --arg url "$base/$(basename "$f")" --rawfile sig "$f.sig" \
              '.[$k] = {url: $url, signature: ($sig | rtrimstr("\n"))}' <<< "$platforms")
          }
          add windows-x86_64-nsis '*-setup.exe'
          add windows-x86_64 '*-setup.exe'
          add linux-x86_64-appimage '*.AppImage'
          add linux-x86_64-deb '*.deb'
          add linux-x86_64 '*.AppImage'
          if [ "$platforms" = '{}' ]; then
            echo "Sin firmas de actualización: no se publica latest.json."
            exit 0
          fi
          jq -n --arg v "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Novedades: https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME" \
            --arg apk "$base/FarmHabit_${version}_android.apk" --argjson p "$platforms" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: $p, downloads: {android: $apk}}' \
            > release/latest.json
          cat release/latest.json
      # Todas se publican como Release normal (también las -rc): el
      # actualizador consulta releases/latest, que ignora las "prerelease".
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release -type f ! -name '*.sig')
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "FarmHabit $GITHUB_REF_NAME" \
            --notes "Instaladores para Windows (.exe), Linux (.AppImage/.deb) y Android (.apk). Cambios en [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." \
            --generate-notes

  pages:
    name: Demo web (GitHub Pages)
    # En cada push a main y al lanzarlo a mano (Actions → Build → Run workflow).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    # Si GitHub Pages no está activado en el repositorio, este paso falla sin
    # marcar como fallida toda la ejecución.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar la demo
        run: pnpm --filter @farmhabit/app exec vite build
        env:
          VITE_DEMO: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
          # La demo no sincroniza: sin credenciales de Google.
          VITE_GOOGLE_CLIENT_ID: ''
          VITE_GOOGLE_CLIENT_SECRET: ''
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/app/dist
      - id: deploy
        uses: actions/deploy-pages@v5
